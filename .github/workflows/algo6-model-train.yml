name: ALGO-6 candidate model training

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algo6-candidate-model-training
  cancel-in-progress: false

jobs:
  train-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/algo6/requirements.txt
      - name: Install pinned trainer dependencies
        run: python -m pip install -r scripts/algo6/requirements.txt
      - name: Train and register candidate when readiness permits
        env:
          SUPABASE_URL: ${{ secrets.ALGO6_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ALGO6_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/algo6/train_model.py
