          "$NELYON_WRANGLER" versions list \
            --config apps/admin-web/deployment/wrangler.preview.jsonc --json \
            > admin-evidence/admin-web-after-versions.json
          node scripts/nelyon-admin-production-release.mjs identify-upload \
            --source-manifest admin-release-artifact/admin-web-manifest.json \
            --before admin-evidence/admin-web-before-versions.json \
            --after admin-evidence/admin-web-after-versions.json \
            --upload-log admin-evidence/admin-web-upload.log \
            --output admin-evidence/admin-web-candidate-id.json

      - name: Attest and smoke the exact uploaded Admin version
        id: admin_candidate
        if: (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true' && steps.admin_upload.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          VERSION_ID="$(node -p "JSON.parse(require('fs').readFileSync('admin-evidence/admin-web-candidate-id.json','utf8')).version_id")"
          "$NELYON_WRANGLER" versions view "$VERSION_ID" \
            --config apps/admin-web/deployment/wrangler.preview.jsonc --json \
            > admin-evidence/admin-web-version.json
          node scripts/nelyon-admin-production-release.mjs identify-upload \
            --source-manifest admin-release-artifact/admin-web-manifest.json \
            --before admin-evidence/admin-web-before-versions.json \
            --after admin-evidence/admin-web-after-versions.json \
            --version-view admin-evidence/admin-web-version.json \
            --upload-log admin-evidence/admin-web-upload.log \
            --build-manifest admin-evidence/admin-web-build.json \
            --output admin-evidence/admin-web-candidate.json
          PREVIEW_URL="$(node -p "JSON.parse(require('fs').readFileSync('admin-evidence/admin-web-candidate.json','utf8')).preview_url")"
          node scripts/nelyon-admin-production-release.mjs smoke \
            --base-url "$PREVIEW_URL" \
            --candidate admin-evidence/admin-web-candidate.json \
            --build admin-evidence/admin-web-build.json \
            --output admin-evidence/admin-web-preview-http.json

      - name: Verify independent private runtime closure before Admin promotion
        if: >-
          (needs.plan.outputs.mode == 'release' ||
           (needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_recovery_b2_required == 'true')) &&
          needs.plan.outputs.admin_enabled == 'true' && steps.admin_candidate.outcome == 'success'
        env:
          NELYON_PRIVATE_AUTHORITY_RUNTIME_CLOSURE_SHA256: ${{ vars.NELYON_PRIVATE_AUTHORITY_RUNTIME_CLOSURE_SHA256 }}
        run: node "$RUNNER_TEMP/nelyon-private-runtime-bootstrap.cjs"

      - name: Resolve protected private authority before Admin promotion
        id: b2_admin_promote_authority
        if: needs.plan.outputs.mode == 'release' && needs.plan.outputs.admin_enabled == 'true' && steps.admin_candidate.outcome == 'success'
        env: *current_private_authority_env
        run: |
          set -euo pipefail
          node scripts/nelyon-private-authority-cli.mjs authority-proof \
            --policy "$NELYON_POLICY" --request release-artifact/request.json --bundle release-artifact/bundle \
            --verification-output "$RUNNER_TEMP/nelyon-private-authority-public/admin-promote-receipt.json"

      - name: Clean private authority scratch before Admin promotion
        id: b2_admin_promote_authority_cleanup
        if: always() && needs.plan.outputs.mode == 'release' && needs.plan.outputs.admin_enabled == 'true' && steps.admin_candidate.outcome == 'success'
        run: node "$RUNNER_TEMP/nelyon-private-runtime-cleanup.cjs"

      - name: Resolve protected private authority before Admin recovery promotion
        id: b2_admin_recovery_promote_authority
        if: >-
          needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_enabled == 'true' &&
          needs.plan.outputs.admin_recovery_b2_required == 'true' && steps.admin_candidate.outcome == 'success'
        env: *admin_historical_private_authority_supabase_env
        run: |
          set -euo pipefail
          chain_args=()
          if [ -d admin-recovery-evidence/authority-chain-release ]; then
            chain_args=(--chain-run admin-recovery-evidence/authority-chain-run.json
              --chain-artifacts admin-recovery-evidence/authority-chain-artifacts.json
              --chain-release-bundle admin-recovery-evidence/authority-chain-release
              --chain-gate-evidence admin-recovery-evidence/authority-chain-gate
              --chain-recovery-evidence admin-recovery-evidence/authority-chain-recovery)
          fi
          node scripts/nelyon-private-authority-cli.mjs verify-admin-recovery-cloudflare-prestate \
            --policy "$NELYON_POLICY" --request release-artifact/request.json --bundle release-artifact/bundle \
            --verification-output "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-promote-receipt.json" \
            --recovery-source-run "${{ steps.admin_recovery_authority_source.outputs.source_run_id }}" \
            --run admin-recovery-evidence/authority-source-run.json \
            --artifacts admin-recovery-evidence/authority-source-artifacts.json \
            --release-bundle admin-recovery-evidence/authority-source-release \
            --gate-evidence admin-recovery-evidence/authority-source-gate \
            --admin-evidence admin-recovery-evidence/authority-source-admin \
            "${chain_args[@]}" \
            --verified-source "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-verified-source.json" \
            --previous "$RUNNER_TEMP/nelyon-private-authority-public/admin-web-previous.json" \
            --routes "$RUNNER_TEMP/nelyon-private-authority-public/admin-web-before-routes.json" \
            --stage-output "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-mutation-stage.json"

      - name: Clean private authority scratch before Admin recovery promotion
        id: b2_admin_recovery_promote_authority_cleanup
        if: >-
          always() && needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_enabled == 'true' &&
          needs.plan.outputs.admin_recovery_b2_required == 'true' && steps.admin_candidate.outcome == 'success'
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/nelyon-private-runtime-cleanup.cjs"
          rm -f "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-mutation-stage.json"

      - name: Promote the exact smoked Admin version
        id: admin_promote
        if: >-
          needs.plan.outputs.admin_enabled == 'true' && steps.admin_candidate.outcome == 'success' &&
          ((needs.plan.outputs.mode == 'release' &&
            steps.b2_admin_promote_authority.outcome == 'success' &&
            steps.b2_admin_promote_authority_cleanup.outcome == 'success') ||
           (needs.plan.outputs.mode == 'admin_recovery' &&
            ((needs.plan.outputs.admin_recovery_b2_required == 'true' &&
              steps.b2_admin_recovery_promote_authority.outcome == 'success' &&
              steps.b2_admin_recovery_promote_authority_cleanup.outcome == 'success') ||
             needs.plan.outputs.admin_recovery_b2_required != 'true')))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_RECOVERY_B2_REQUIRED: ${{ needs.plan.outputs.admin_recovery_b2_required }}
        run: |
          set -euo pipefail
          if [ "${{ needs.plan.outputs.mode }}" = 'release' ]; then
            cmp "$RUNNER_TEMP/nelyon-private-authority-public/expected-receipt.json" "$RUNNER_TEMP/nelyon-private-authority-public/admin-promote-receipt.json"
          elif [ "$ADMIN_RECOVERY_B2_REQUIRED" = 'true' ]; then
            cmp "$RUNNER_TEMP/nelyon-private-authority-public/expected-receipt.json" "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-promote-receipt.json"
          fi
          VERSION_ID="$(node -p "JSON.parse(require('fs').readFileSync('admin-evidence/admin-web-candidate.json','utf8')).version_id")"
          "$NELYON_WRANGLER" versions deploy \
            --config apps/admin-web/deployment/wrangler.preview.jsonc \
            --name nelyon-admin-web \
            --version-id "$VERSION_ID" \
            --percentage 100 \
            --message "Nelyon protected release ${{ inputs.release_id }}" \
            --yes
          "$NELYON_WRANGLER" deployments status \
            --config apps/admin-web/deployment/wrangler.preview.jsonc --json \
            > admin-evidence/admin-web-promoted-deployment.json
          node scripts/nelyon-admin-production-release.mjs active-version \
            --deployment admin-evidence/admin-web-promoted-deployment.json \
            --expected-version "$VERSION_ID" \
            --output admin-evidence/admin-web-promoted-version.json

      - name: Verify promoted Admin version on temporary workers.dev
        id: admin_promoted_smoke
        if: (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true' && steps.admin_promote.outcome == 'success'
        run: |
          set -euo pipefail
          SMOKE_OK=false
          for attempt in $(seq 1 24); do
            ATTEMPT_OUTPUT="admin-evidence/admin-web-promoted-http-attempt-${attempt}.json"
            if node scripts/nelyon-admin-production-release.mjs smoke \
              --base-url https://nelyon-admin-web.nelyon.workers.dev \
              --candidate admin-evidence/admin-web-candidate.json \
              --build admin-evidence/admin-web-build.json \
              --output "${ATTEMPT_OUTPUT}"; then
              mv "${ATTEMPT_OUTPUT}" admin-evidence/admin-web-promoted-http.json
              SMOKE_OK=true
              break
            fi
            if [ "${attempt}" -lt 24 ]; then sleep 5; fi
          done
          test "${SMOKE_OK}" = 'true'

      - name: Verify independent private runtime closure before Admin routes
        if: >-
          (needs.plan.outputs.mode == 'release' ||
           (needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_recovery_b2_required == 'true')) &&
          needs.plan.outputs.admin_enabled == 'true' && steps.admin_promoted_smoke.outcome == 'success'
        env:
          NELYON_PRIVATE_AUTHORITY_RUNTIME_CLOSURE_SHA256: ${{ vars.NELYON_PRIVATE_AUTHORITY_RUNTIME_CLOSURE_SHA256 }}
        run: node "$RUNNER_TEMP/nelyon-private-runtime-bootstrap.cjs"

      - name: Resolve protected private authority before Admin routes
        id: b2_admin_routes_authority
        if: needs.plan.outputs.mode == 'release' && needs.plan.outputs.admin_enabled == 'true' && steps.admin_promoted_smoke.outcome == 'success'
        env: *current_private_authority_env
        run: |
          set -euo pipefail
          node scripts/nelyon-private-authority-cli.mjs authority-proof \
            --policy "$NELYON_POLICY" --request release-artifact/request.json --bundle release-artifact/bundle \
            --verification-output "$RUNNER_TEMP/nelyon-private-authority-public/admin-routes-receipt.json"

      - name: Clean private authority scratch before Admin routes
        id: b2_admin_routes_authority_cleanup
        if: always() && needs.plan.outputs.mode == 'release' && needs.plan.outputs.admin_enabled == 'true' && steps.admin_promoted_smoke.outcome == 'success'
        run: node "$RUNNER_TEMP/nelyon-private-runtime-cleanup.cjs"

      - name: Resolve protected private authority before Admin recovery routes
        id: b2_admin_recovery_routes_authority
        if: >-
          needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_enabled == 'true' &&
          needs.plan.outputs.admin_recovery_b2_required == 'true' && steps.admin_promoted_smoke.outcome == 'success'
        env: *admin_historical_private_authority_supabase_env
        run: |
          set -euo pipefail
          chain_args=()
          if [ -d admin-recovery-evidence/authority-chain-release ]; then
            chain_args=(--chain-run admin-recovery-evidence/authority-chain-run.json
              --chain-artifacts admin-recovery-evidence/authority-chain-artifacts.json
              --chain-release-bundle admin-recovery-evidence/authority-chain-release
              --chain-gate-evidence admin-recovery-evidence/authority-chain-gate
              --chain-recovery-evidence admin-recovery-evidence/authority-chain-recovery)
          fi
          node scripts/nelyon-private-authority-cli.mjs verify-admin-recovery-cloudflare-prestate \
            --policy "$NELYON_POLICY" --request release-artifact/request.json --bundle release-artifact/bundle \
            --verification-output "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-routes-receipt.json" \
            --recovery-source-run "${{ steps.admin_recovery_authority_source.outputs.source_run_id }}" \
            --run admin-recovery-evidence/authority-source-run.json \
            --artifacts admin-recovery-evidence/authority-source-artifacts.json \
            --release-bundle admin-recovery-evidence/authority-source-release \
            --gate-evidence admin-recovery-evidence/authority-source-gate \
            --admin-evidence admin-recovery-evidence/authority-source-admin \
            "${chain_args[@]}" \
            --verified-source "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-verified-source.json" \
            --previous "$RUNNER_TEMP/nelyon-private-authority-public/admin-web-previous.json" \
            --routes "$RUNNER_TEMP/nelyon-private-authority-public/admin-web-before-routes.json" \
            --stage-output "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-mutation-stage.json"

      - name: Clean private authority scratch before Admin recovery routes
        id: b2_admin_recovery_routes_authority_cleanup
        if: >-
          always() && needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_enabled == 'true' &&
          needs.plan.outputs.admin_recovery_b2_required == 'true' && steps.admin_promoted_smoke.outcome == 'success'
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/nelyon-private-runtime-cleanup.cjs"
          rm -f "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-mutation-stage.json"

      - name: Apply exact Admin production routes
        id: admin_routes
        if: >-
          needs.plan.outputs.admin_enabled == 'true' && steps.admin_promoted_smoke.outcome == 'success' &&
          ((needs.plan.outputs.mode == 'release' &&
            steps.b2_admin_routes_authority.outcome == 'success' &&
            steps.b2_admin_routes_authority_cleanup.outcome == 'success') ||
           (needs.plan.outputs.mode == 'admin_recovery' &&
            ((needs.plan.outputs.admin_recovery_b2_required == 'true' &&
              steps.b2_admin_recovery_routes_authority.outcome == 'success' &&
              steps.b2_admin_recovery_routes_authority_cleanup.outcome == 'success') ||
             needs.plan.outputs.admin_recovery_b2_required != 'true')))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_RECOVERY_B2_REQUIRED: ${{ needs.plan.outputs.admin_recovery_b2_required }}
        run: |
          set -euo pipefail
          if [ "${{ needs.plan.outputs.mode }}" = 'release' ]; then
            cmp "$RUNNER_TEMP/nelyon-private-authority-public/expected-receipt.json" "$RUNNER_TEMP/nelyon-private-authority-public/admin-routes-receipt.json"
          elif [ "$ADMIN_RECOVERY_B2_REQUIRED" = 'true' ]; then
            cmp "$RUNNER_TEMP/nelyon-private-authority-public/expected-receipt.json" "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-routes-receipt.json"
          fi
          "$NELYON_WRANGLER" triggers deploy \
            --config apps/admin-web/deployment/wrangler.route.jsonc

      - name: Wait for exact Admin production route activation
        id: admin_route_activation
        if: (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true' && steps.admin_routes.outcome == 'success'
        run: |
          set -euo pipefail
          ROUTE_ACTIVE=false
          for attempt in $(seq 1 60); do
            ATTEMPT_OUTPUT="admin-evidence/admin-web-route-probe-attempt-${attempt}.json"
            if node scripts/nelyon-admin-production-release.mjs route-probe \
              --base-url https://nelyon.app \
              --candidate admin-evidence/admin-web-candidate.json \
              --build admin-evidence/admin-web-build.json \
              --attempt "${attempt}" \
              --output "${ATTEMPT_OUTPUT}"; then
              mv "${ATTEMPT_OUTPUT}" admin-evidence/admin-web-route-probe.json
              ROUTE_ACTIVE=true
              break
            fi
            if [ "${attempt}" -lt 60 ]; then sleep 5; fi
          done
          test "${ROUTE_ACTIVE}" = 'true'

      - name: Verify independent private runtime closure before Admin cache purge
        if: >-
          (needs.plan.outputs.mode == 'release' ||
