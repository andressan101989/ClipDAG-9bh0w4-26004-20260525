name: Nelyon controlled production release
run-name: Nelyon production release | ${{ inputs.mode }} | ${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact 40-character origin/main SHA
        required: true
        type: string
      release_id:
        description: Unique auditable release identifier
        required: true
        type: string
      scope_confirmation:
        description: Exact policy confirmation class
        required: true
        type: string
      mode:
        description: Controlled release mode
        required: true
        type: choice
        options:
          - plan_only
          - gate_proof
          - release
          - admin_recovery
          - postcheck_recovery
      recovery_source_run_id:
        description: Exact source run ID, only for an explicit recovery mode
        required: false
        type: string

permissions:
  contents: read

env:
  NELYON_POLICY: .github/nelyon-production-release-policy.json
  NELYON_HELPER: scripts/nelyon-production-release.mjs
  NELYON_PROJECT_REF: aewwdlvbwpczqyvkwvvj
  NELYON_WRANGLER: apps/admin-web/node_modules/.bin/wrangler

jobs:
  plan:
    name: Build immutable release plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.expose.outputs.mode }}
      digest: ${{ steps.expose.outputs.digest }}
      risk: ${{ steps.expose.outputs.risk }}
      productive_change_count: ${{ steps.expose.outputs.productive_change_count }}
      result: ${{ steps.expose.outputs.result }}
      blocked: ${{ steps.expose.outputs.blocked }}
      compiler_sha256: ${{ steps.expose.outputs.compiler_sha256 }}
      artifact_name: ${{ steps.expose.outputs.artifact_name }}
      recovery_release_artifact_name: ${{ steps.expose.outputs.recovery_release_artifact_name }}
      recovery_gate_artifact_name: ${{ steps.expose.outputs.recovery_gate_artifact_name }}
      admin_enabled: ${{ steps.expose.outputs.admin_enabled }}
      admin_digest: ${{ steps.expose.outputs.admin_digest }}
      admin_artifact_name: ${{ steps.expose.outputs.admin_artifact_name }}
    steps:
      - name: Checkout exact approved SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'

      - name: Record request and complete retained history
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_APPROVED_SHA: ${{ inputs.approved_sha }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_SCOPE_CONFIRMATION: ${{ inputs.scope_confirmation }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_RECOVERY_SOURCE_RUN_ID: ${{ inputs.recovery_source_run_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REF_NAME: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          mkdir -p release-input release-artifact/bundle
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const postcheckRecovery = process.env.INPUT_MODE === 'postcheck_recovery';
          const adminRecovery = process.env.INPUT_MODE === 'admin_recovery';
          const recoveryMode = postcheckRecovery || adminRecovery;
          if (postcheckRecovery) {
            if (!/^[1-9][0-9]*$/.test(process.env.INPUT_RECOVERY_SOURCE_RUN_ID ?? '')) throw new Error('postcheck_recovery requires a numeric approved source run');
            if (process.env.INPUT_SCOPE_CONFIRMATION !== 'POSTCHECK_RECOVERY_READ_ONLY') throw new Error('postcheck_recovery requires POSTCHECK_RECOVERY_READ_ONLY');
          } else if (adminRecovery) {
            if (!/^[1-9][0-9]*$/.test(process.env.INPUT_RECOVERY_SOURCE_RUN_ID ?? '')) throw new Error('admin_recovery requires a numeric exact source run');
            if (process.env.INPUT_SCOPE_CONFIRMATION !== 'ADMIN_RECOVERY_EXACT_SOURCE') throw new Error('admin_recovery requires ADMIN_RECOVERY_EXACT_SOURCE');
          } else if (process.env.INPUT_RECOVERY_SOURCE_RUN_ID) {
            throw new Error('recovery_source_run_id is valid only for an explicit recovery mode');
          }
          const request = {
            actor: process.env.ACTOR,
            triggeringActor: process.env.TRIGGERING_ACTOR,
            repository: process.env.REPOSITORY,
            workflowRef: process.env.WORKFLOW_REF,
            ref: process.env.REF_NAME,
            approvedSha: process.env.INPUT_APPROVED_SHA,
            mainSha: process.env.INPUT_APPROVED_SHA,
            releaseId: process.env.INPUT_RELEASE_ID,
            mode: process.env.INPUT_MODE,
            scopeConfirmation: process.env.INPUT_SCOPE_CONFIRMATION,
            runId: process.env.RUN_ID,
            runAttempt: Number(process.env.RUN_ATTEMPT),
            recoverySourceRunId: recoveryMode ? process.env.INPUT_RECOVERY_SOURCE_RUN_ID : null,
            productiveResources: [],
          };
          writeFileSync('release-input/request.json', JSON.stringify(request));
          const pages = [];
          for (let page = 1; ; page += 1) {
            const url = `${process.env.API_URL}/repos/${process.env.REPOSITORY}/actions/workflows/nelyon-production-release.yml/runs?per_page=100&page=${page}`;
            const response = await fetch(url, {
              headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' },
            });
            if (!response.ok) throw new Error(`workflow history HTTP ${response.status}`);
            const body = await response.json();
            const items = body.workflow_runs
              .filter(run => String(run.id) !== process.env.RUN_ID)
              .map(run => ({
                release_id: String(run.display_title ?? run.name ?? '').split(' | ').at(-1),
                run_id: String(run.id),
                run_attempt: run.run_attempt,
                conclusion: run.conclusion,
              }));
            pages.push({ items });
            if (body.workflow_runs.length < 100) break;
          }
          writeFileSync('release-input/history.json', JSON.stringify({ complete: true, pages }));
          NODE

      - name: Generate canonical plan and manifest
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" plan \
            --policy "$NELYON_POLICY" \
            --request release-input/request.json \
            --history release-input/history.json \
            --evidence-output release-input/remote-evidence.json \
            --output release-artifact/bundle

      - name: Create immutable Admin Web manifest
        run: |
          set -euo pipefail
          mkdir -p admin-release-artifact
          node scripts/nelyon-admin-production-release.mjs plan \
            --approved-sha "${{ inputs.approved_sha }}" \
            --release-manifest release-artifact/bundle/manifest.json \
            --output admin-release-artifact/admin-web-manifest.json \
            --digest-output admin-release-artifact/admin-web-manifest.sha256

      - name: Expose non-secret plan outputs
        id: expose
        env:
          INPUT_MODE: ${{ inputs.mode }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('release-artifact/bundle/manifest.json', 'utf8'));
          const admin = JSON.parse(readFileSync('admin-release-artifact/admin-web-manifest.json', 'utf8'));
          const policy = JSON.parse(readFileSync('.github/nelyon-production-release-policy.json', 'utf8'));
          const request = JSON.parse(readFileSync('release-input/request.json', 'utf8'));
          const digest = readFileSync('release-artifact/bundle/manifest.sha256', 'utf8').trim();
          appendFileSync(process.env.GITHUB_OUTPUT, `mode=${manifest.identity.mode}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `digest=${digest}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `risk=${manifest.risk.level}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `productive_change_count=${manifest.delta.productive_change_count}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `result=${manifest.result}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `blocked=${manifest.result === 'DENY'}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `compiler_sha256=${manifest.compiler.sha256}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact_name=nelyon-release-${process.env.RUN_ID}-${process.env.RUN_ATTEMPT}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `admin_enabled=${admin.enabled}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `admin_digest=${readFileSync('admin-release-artifact/admin-web-manifest.sha256', 'utf8').trim()}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `admin_artifact_name=nelyon-admin-plan-${process.env.RUN_ID}-${process.env.RUN_ATTEMPT}\n`);
          const recoverySource = policy.postcheck_recovery.approved_sources.find(item => item.run_id === request.recoverySourceRunId);
          if (process.env.INPUT_MODE === 'postcheck_recovery' && !recoverySource) throw new Error('approved recovery source is unavailable');
          appendFileSync(process.env.GITHUB_OUTPUT, `recovery_release_artifact_name=${recoverySource?.release_artifact?.name ?? ''}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `recovery_gate_artifact_name=${recoverySource?.gate_artifact?.name ?? ''}\n`);
          NODE
          cat release-artifact/bundle/summary.md >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const admin = JSON.parse(readFileSync('admin-release-artifact/admin-web-manifest.json', 'utf8'));
          const digest = readFileSync('admin-release-artifact/admin-web-manifest.sha256', 'utf8').trim();
          process.stdout.write(`\n## Admin Web production manifest\n\n- Required: \`${admin.enabled}\`\n- Source SHA-256: \`${admin.source.sha256}\`\n- Manifest SHA-256: \`${digest}\`\n`);
          NODE

      - name: Package current-run evidence
        run: |
          set -euo pipefail
          cp release-input/request.json release-artifact/request.json
          cp release-input/remote-evidence.json release-artifact/remote-evidence.json

      - name: Upload one immutable current-run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.expose.outputs.artifact_name }}
          path: release-artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload immutable Admin Web plan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.expose.outputs.admin_artifact_name }}
          path: admin-release-artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  deploy:
    name: Protected production gate
    needs: plan
    if: >-
      needs.plan.outputs.mode == 'gate_proof' ||
      (needs.plan.outputs.mode == 'admin_recovery' &&
       needs.plan.outputs.risk == 'HIGH' &&
       needs.plan.outputs.admin_enabled == 'true' &&
       needs.plan.outputs.result == 'NO PRODUCTIVE CHANGES' &&
       fromJSON(needs.plan.outputs.productive_change_count) == 0 &&
       needs.plan.outputs.blocked == 'false') ||
      (needs.plan.outputs.mode == 'postcheck_recovery' &&
       needs.plan.outputs.result == 'NO PRODUCTIVE CHANGES' &&
       fromJSON(needs.plan.outputs.productive_change_count) == 0 &&
       needs.plan.outputs.blocked == 'false') ||
      (needs.plan.outputs.mode == 'release' &&
       (needs.plan.outputs.admin_enabled != 'true' || needs.plan.outputs.risk == 'HIGH') &&
       ((needs.plan.outputs.result == 'PLAN READY' &&
         fromJSON(needs.plan.outputs.productive_change_count) > 0) ||
        (needs.plan.outputs.admin_enabled == 'true' &&
         needs.plan.outputs.result == 'NO PRODUCTIVE CHANGES' &&
         fromJSON(needs.plan.outputs.productive_change_count) == 0)) &&
       needs.plan.outputs.blocked == 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    concurrency:
      group: nelyon-supabase-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: read
    env:
      NELYON_RELEASE_POLICY_SHA256: ${{ vars.NELYON_RELEASE_POLICY_SHA256 }}
      SUPABASE_GITHUB_AUTO_DEPLOY_EXPECTED: ${{ vars.SUPABASE_GITHUB_AUTO_DEPLOY_EXPECTED }}
    steps:
      - name: Checkout exact authorized SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js for authorized gate
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'

      - name: Download only this run attempt artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: release-artifact
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Download exact Admin Web plan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.plan.outputs.admin_artifact_name }}
          path: admin-release-artifact
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Fetch current Environment and authorization evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' };
          const get = async url => {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`${url} HTTP ${response.status}`);
            return response.json();
          };
          const environment = await get(`${process.env.API_URL}/repos/${process.env.REPOSITORY}/environments/production`);
          writeFileSync('gate-evidence/environment.json', JSON.stringify(environment));
          const branchPages = [];
          for (let page = 1; ; page += 1) {
            const body = await get(`${process.env.API_URL}/repos/${process.env.REPOSITORY}/environments/production/deployment-branch-policies?per_page=100&page=${page}`);
            const items = body.branch_policies ?? [];
            branchPages.push({ items });
            if (items.length < 100) break;
          }
          writeFileSync('gate-evidence/branches.json', JSON.stringify({ complete: true, pages: branchPages }));
          const approvals = await get(`${process.env.API_URL}/repos/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}/approvals`);
          writeFileSync('gate-evidence/approvals.json', JSON.stringify({ complete: true, sourceRunId: process.env.RUN_ID, sourceRunAttempt: Number(process.env.RUN_ATTEMPT), pages: [{ items: approvals }] }));
          const runPages = [];
          const activeStatuses = ['in_progress', 'queued', 'requested', 'waiting', 'pending'];
          for (const status of activeStatuses) {
            for (let page = 1; ; page += 1) {
              const body = await get(`${process.env.API_URL}/repos/${process.env.REPOSITORY}/actions/workflows/nelyon-production-release.yml/runs?status=${status}&per_page=100&page=${page}`);
              const items = body.workflow_runs ?? [];
              runPages.push({ items });
              if (items.length < 100) break;
            }
          }
          writeFileSync('gate-evidence/runs.json', JSON.stringify({ complete: true, pages: runPages }));
          NODE

      - name: Revalidate immutable manifest after authorization
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          node "$NELYON_HELPER" revalidate --policy "$NELYON_POLICY" --request release-artifact/request.json --bundle release-artifact/bundle --compiler-sha256 "${{ needs.plan.outputs.compiler_sha256 }}" --remote-evidence release-artifact/remote-evidence.json --output gate-evidence/revalidation.json

      - name: Verify immutable Admin Web manifest
        run: |
          set -euo pipefail
          node scripts/nelyon-admin-production-release.mjs verify-plan \
            --approved-sha "${{ inputs.approved_sha }}" \
            --release-manifest release-artifact/bundle/manifest.json \
            --manifest admin-release-artifact/admin-web-manifest.json \
            --digest admin-release-artifact/admin-web-manifest.sha256

      - name: Verify gate proof without deployment secrets
        if: needs.plan.outputs.mode == 'gate_proof'
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" verify-gate --policy "$NELYON_POLICY" --policy-sha256 "$NELYON_RELEASE_POLICY_SHA256" --request release-artifact/request.json --bundle release-artifact/bundle --compiler-sha256 "${{ needs.plan.outputs.compiler_sha256 }}" --environment gate-evidence/environment.json --branch-policies gate-evidence/branches.json --approvals gate-evidence/approvals.json --auto-deploy-expected "$SUPABASE_GITHUB_AUTO_DEPLOY_EXPECTED" --runs gate-evidence/runs.json --output gate-evidence/gate-proof.json
          echo "GATE PROOF SUCCESS" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify postcheck recovery gate without deployment commands
        if: needs.plan.outputs.mode == 'postcheck_recovery'
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" verify-gate --policy "$NELYON_POLICY" --policy-sha256 "$NELYON_RELEASE_POLICY_SHA256" --request release-artifact/request.json --bundle release-artifact/bundle --compiler-sha256 "${{ needs.plan.outputs.compiler_sha256 }}" --environment gate-evidence/environment.json --branch-policies gate-evidence/branches.json --approvals gate-evidence/approvals.json --auto-deploy-expected "$SUPABASE_GITHUB_AUTO_DEPLOY_EXPECTED" --runs gate-evidence/runs.json --output gate-evidence/gate-proof.json

      - name: Verify release gate and required Environment secrets
        if: needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" verify-gate --policy "$NELYON_POLICY" --policy-sha256 "$NELYON_RELEASE_POLICY_SHA256" --request release-artifact/request.json --bundle release-artifact/bundle --compiler-sha256 "${{ needs.plan.outputs.compiler_sha256 }}" --environment gate-evidence/environment.json --branch-policies gate-evidence/branches.json --approvals gate-evidence/approvals.json --auto-deploy-expected "$SUPABASE_GITHUB_AUTO_DEPLOY_EXPECTED" --runs gate-evidence/runs.json --output gate-evidence/gate-proof.json

      - name: Fetch exact Admin recovery source metadata
        id: admin_recovery_metadata
        if: needs.plan.outputs.mode == 'admin_recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          SOURCE_RUN_ID: ${{ inputs.recovery_source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p admin-recovery-evidence
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs';
          const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' };
          const get = async url => {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`${url} HTTP ${response.status}`);
            return response.json();
          };
          const run = await get(`${process.env.API_URL}/repos/${process.env.REPOSITORY}/actions/runs/${process.env.SOURCE_RUN_ID}`);
          writeFileSync('admin-recovery-evidence/source-run.json', JSON.stringify(run));
          const artifacts = [];
          for (let page = 1; ; page += 1) {
            const body = await get(`${process.env.API_URL}/repos/${process.env.REPOSITORY}/actions/runs/${process.env.SOURCE_RUN_ID}/artifacts?per_page=100&page=${page}`);
            const items = body.artifacts ?? [];
            artifacts.push(...items);
            if (items.length < 100) break;
          }
          writeFileSync('admin-recovery-evidence/source-artifacts.json', JSON.stringify(artifacts));
          const attempt = Number(run.run_attempt);
          if (!Number.isSafeInteger(attempt) || attempt < 1) throw new Error('invalid source run attempt');
          const sourceKind = run.conclusion === 'failure'
            ? 'direct_release'
            : run.conclusion === 'success'
              ? 'postcheck_recovery'
              : null;
          if (!sourceKind) throw new Error('Admin recovery source must be a completed release failure or postcheck recovery success');
          appendFileSync(process.env.GITHUB_OUTPUT, `source_kind=${sourceKind}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `release_artifact_name=nelyon-release-${process.env.SOURCE_RUN_ID}-${attempt}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `gate_artifact_name=nelyon-gate-evidence-${process.env.SOURCE_RUN_ID}-${attempt}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `admin_artifact_name=nelyon-admin-evidence-${process.env.SOURCE_RUN_ID}-${attempt}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `postcheck_recovery_artifact_name=nelyon-postcheck-recovery-${process.env.SOURCE_RUN_ID}-${attempt}\n`);
          NODE

      - name: Download exact declared Admin recovery source release artifact
        if: needs.plan.outputs.mode == 'admin_recovery'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.admin_recovery_metadata.outputs.release_artifact_name }}
          path: admin-recovery-evidence/declared-source-release
          run-id: ${{ inputs.recovery_source_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact declared Admin recovery source gate artifact
        if: needs.plan.outputs.mode == 'admin_recovery'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.admin_recovery_metadata.outputs.gate_artifact_name }}
          path: admin-recovery-evidence/declared-source-gate
          run-id: ${{ inputs.recovery_source_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact direct Admin recovery source Admin artifact
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_metadata.outputs.source_kind == 'direct_release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.admin_recovery_metadata.outputs.admin_artifact_name }}
          path: admin-recovery-evidence/declared-source-admin
          run-id: ${{ inputs.recovery_source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact direct Admin recovery source provenance
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_metadata.outputs.source_kind == 'direct_release'
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" verify-admin-recovery-source \
            --policy "$NELYON_POLICY" \
            --request release-artifact/request.json \
            --recovery-manifest release-artifact/bundle/manifest.json \
            --run admin-recovery-evidence/source-run.json \
            --artifacts admin-recovery-evidence/source-artifacts.json \
            --release-bundle admin-recovery-evidence/declared-source-release \
            --gate-evidence admin-recovery-evidence/declared-source-gate \
            --admin-evidence admin-recovery-evidence/declared-source-admin \
            --output admin-recovery-evidence/verified-source.json

      - name: Download exact postcheck recovery evidence artifact
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_metadata.outputs.source_kind == 'postcheck_recovery'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.admin_recovery_metadata.outputs.postcheck_recovery_artifact_name }}
          path: admin-recovery-evidence/postcheck-recovery-source
          run-id: ${{ inputs.recovery_source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact Admin postcheck recovery chain provenance
        id: admin_recovery_chain
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_metadata.outputs.source_kind == 'postcheck_recovery'
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" verify-admin-recovery-postcheck-chain \
            --policy "$NELYON_POLICY" \
            --request release-artifact/request.json \
            --recovery-manifest release-artifact/bundle/manifest.json \
            --run admin-recovery-evidence/source-run.json \
            --artifacts admin-recovery-evidence/source-artifacts.json \
            --release-bundle admin-recovery-evidence/declared-source-release \
            --gate-evidence admin-recovery-evidence/declared-source-gate \
            --postcheck-recovery-evidence admin-recovery-evidence/postcheck-recovery-source \
            --output admin-recovery-evidence/postcheck-recovery-chain.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const chain = JSON.parse(readFileSync('admin-recovery-evidence/postcheck-recovery-chain.json', 'utf8'));
          if (chain.result !== 'ADMIN_RECOVERY_POSTCHECK_CHAIN_VERIFIED') throw new Error('postcheck recovery chain is not verified');
          appendFileSync(process.env.GITHUB_OUTPUT, `original_source_run_id=${chain.source_run_id}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `original_source_run_attempt=${chain.source_run_attempt}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `original_release_artifact_name=nelyon-release-${chain.source_run_id}-${chain.source_run_attempt}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `original_gate_artifact_name=nelyon-gate-evidence-${chain.source_run_id}-${chain.source_run_attempt}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `original_admin_artifact_name=nelyon-admin-evidence-${chain.source_run_id}-${chain.source_run_attempt}\n`);
          NODE

      - name: Fetch exact original Admin recovery release metadata
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_metadata.outputs.source_kind == 'postcheck_recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          SOURCE_RUN_ID: ${{ steps.admin_recovery_chain.outputs.original_source_run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' };
          const get = async url => {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`${url} HTTP ${response.status}`);
            return response.json();
          };
          const run = await get(`${process.env.API_URL}/repos/${process.env.REPOSITORY}/actions/runs/${process.env.SOURCE_RUN_ID}`);
          writeFileSync('admin-recovery-evidence/original-source-run.json', JSON.stringify(run));
          const artifacts = [];
          for (let page = 1; ; page += 1) {
            const body = await get(`${process.env.API_URL}/repos/${process.env.REPOSITORY}/actions/runs/${process.env.SOURCE_RUN_ID}/artifacts?per_page=100&page=${page}`);
            const items = body.artifacts ?? [];
            artifacts.push(...items);
            if (items.length < 100) break;
          }
          writeFileSync('admin-recovery-evidence/original-source-artifacts.json', JSON.stringify(artifacts));
          NODE

      - name: Download exact original Admin recovery source release artifact
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_metadata.outputs.source_kind == 'postcheck_recovery'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.admin_recovery_chain.outputs.original_release_artifact_name }}
          path: admin-recovery-evidence/original-source-release
          run-id: ${{ steps.admin_recovery_chain.outputs.original_source_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact original Admin recovery source gate artifact
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_metadata.outputs.source_kind == 'postcheck_recovery'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.admin_recovery_chain.outputs.original_gate_artifact_name }}
          path: admin-recovery-evidence/original-source-gate
          run-id: ${{ steps.admin_recovery_chain.outputs.original_source_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact original Admin recovery source Admin artifact
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_metadata.outputs.source_kind == 'postcheck_recovery'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.admin_recovery_chain.outputs.original_admin_artifact_name }}
          path: admin-recovery-evidence/original-source-admin
          run-id: ${{ steps.admin_recovery_chain.outputs.original_source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact chained Admin recovery source provenance
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_metadata.outputs.source_kind == 'postcheck_recovery'
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" verify-admin-recovery-source \
            --policy "$NELYON_POLICY" \
            --request release-artifact/request.json \
            --recovery-manifest release-artifact/bundle/manifest.json \
            --run admin-recovery-evidence/original-source-run.json \
            --artifacts admin-recovery-evidence/original-source-artifacts.json \
            --release-bundle admin-recovery-evidence/original-source-release \
            --gate-evidence admin-recovery-evidence/original-source-gate \
            --admin-evidence admin-recovery-evidence/original-source-admin \
            --postcheck-recovery-chain admin-recovery-evidence/postcheck-recovery-chain.json \
            --output admin-recovery-evidence/verified-source.json

      - name: Download exact approved source release artifact
        if: needs.plan.outputs.mode == 'postcheck_recovery'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.plan.outputs.recovery_release_artifact_name }}
          path: recovery-evidence/source-release
          run-id: ${{ inputs.recovery_source_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact approved source gate artifact
        if: needs.plan.outputs.mode == 'postcheck_recovery'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.plan.outputs.recovery_gate_artifact_name }}
          path: recovery-evidence/source-gate
          run-id: ${{ inputs.recovery_source_run_id }}
          github-token: ${{ github.token }}

      - name: Fetch exact recovery source metadata
        if: needs.plan.outputs.mode == 'postcheck_recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          SOURCE_RUN_ID: ${{ inputs.recovery_source_run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' };
          const get = async url => {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`${url} HTTP ${response.status}`);
            return response.json();
          };
          const run = await get(`${process.env.API_URL}/repos/${process.env.REPOSITORY}/actions/runs/${process.env.SOURCE_RUN_ID}`);
          writeFileSync('recovery-evidence/source-run.json', JSON.stringify(run));
          const artifacts = [];
          for (let page = 1; ; page += 1) {
            const body = await get(`${process.env.API_URL}/repos/${process.env.REPOSITORY}/actions/runs/${process.env.SOURCE_RUN_ID}/artifacts?per_page=100&page=${page}`);
            const items = body.artifacts ?? [];
            artifacts.push(...items);
            if (items.length < 100) break;
          }
          writeFileSync('recovery-evidence/source-artifacts.json', JSON.stringify(artifacts));
          NODE

      - name: Verify exact recovery source provenance
        if: needs.plan.outputs.mode == 'postcheck_recovery'
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" verify-recovery-source \
            --policy "$NELYON_POLICY" \
            --recovery-source-run "${{ inputs.recovery_source_run_id }}" \
            --run recovery-evidence/source-run.json \
            --artifacts recovery-evidence/source-artifacts.json \
            --release-bundle recovery-evidence/source-release \
            --gate-evidence recovery-evidence/source-gate \
            --output recovery-evidence/verified-source.json

      - name: Capture fresh read-only postcheck recovery snapshot
        if: needs.plan.outputs.mode == 'postcheck_recovery'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/nelyon-production-snapshot-adapter.mjs capture \
            --phase recovery \
            --policy "$NELYON_POLICY" \
            --request release-artifact/request.json \
            --manifest release-artifact/bundle/manifest.json \
            --output recovery-evidence/production-recovery.json

      - name: Require read-only postcheck recovery success
        if: needs.plan.outputs.mode == 'postcheck_recovery'
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" postcheck-recovery \
            --policy "$NELYON_POLICY" \
            --request release-artifact/request.json \
            --recovery-manifest release-artifact/bundle/manifest.json \
            --verified-source recovery-evidence/verified-source.json \
            --current-snapshot recovery-evidence/production-recovery.json \
            --output recovery-evidence/postcheck-recovery-result.json
          echo "POSTCHECK RECOVERY SUCCESS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized postcheck recovery evidence
        if: always() && needs.plan.outputs.mode == 'postcheck_recovery'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nelyon-postcheck-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-evidence/verified-source.json
            recovery-evidence/production-recovery.json
            recovery-evidence/postcheck-recovery-result.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Set up pinned Supabase CLI for an authorized release only
        if: needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: '2.120.0'

      - name: Capture immutable read-only production pre-snapshot
        id: pre_snapshot
        if: needs.plan.outputs.mode == 'release'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/nelyon-production-snapshot-adapter.mjs capture \
            --phase pre \
            --policy "$NELYON_POLICY" \
            --request release-artifact/request.json \
            --manifest release-artifact/bundle/manifest.json \
            --output gate-evidence/production-pre.json

      - name: Verify owner-reviewed production baseline before mutation
        id: verify_pre_snapshot
        if: needs.plan.outputs.mode == 'release'
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" verify-pre-snapshot \
            --policy "$NELYON_POLICY" \
            --request release-artifact/request.json \
            --manifest release-artifact/bundle/manifest.json \
            --pre-snapshot gate-evidence/production-pre.json \
            --output gate-evidence/pre-snapshot-verification.json

      - name: Resolve canonical public Admin build environment
        id: admin_build_env
        if: (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p admin-evidence
          KEY_FILE="$RUNNER_TEMP/nelyon-public-api-keys.json"
          trap 'rm -f "$KEY_FILE"' EXIT
          supabase projects api-keys --project-ref "$NELYON_PROJECT_REF" --output json > "$KEY_FILE"
          node scripts/nelyon-admin-production-release.mjs build-env \
            --api-keys "$KEY_FILE" \
            --github-env "$GITHUB_ENV"

      - name: Build Admin reproducibly
        id: admin_build
        if: (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true'
        run: |
          set -euo pipefail
          npm ci --prefix apps/admin-web
          test -x "$NELYON_WRANGLER"
          test "$("$NELYON_WRANGLER" --version)" = '4.135.0'
          npm --prefix apps/admin-web run build:deployment
          node scripts/nelyon-admin-production-release.mjs build-manifest \
            --approved-sha "${{ inputs.approved_sha }}" \
            --source-manifest admin-release-artifact/admin-web-manifest.json \
            --dist apps/admin-web/dist \
            --output admin-evidence/admin-web-build-first.json
          node --input-type=module -e "import { rmSync } from 'node:fs'; rmSync('apps/admin-web/dist',{recursive:true,force:true})"
          npm --prefix apps/admin-web run build:deployment
          node scripts/nelyon-admin-production-release.mjs build-manifest \
            --approved-sha "${{ inputs.approved_sha }}" \
            --source-manifest admin-release-artifact/admin-web-manifest.json \
            --dist apps/admin-web/dist \
            --output admin-evidence/admin-web-build-second.json
          node scripts/nelyon-admin-production-release.mjs compare-builds \
            --first admin-evidence/admin-web-build-first.json \
            --second admin-evidence/admin-web-build-second.json \
            --output admin-evidence/admin-web-build.json

      - name: Capture Admin recovery read-only production post-state
        id: admin_recovery_snapshot
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_build.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/nelyon-production-snapshot-adapter.mjs capture \
            --phase post \
            --policy "$NELYON_POLICY" \
            --request release-artifact/request.json \
            --manifest release-artifact/bundle/manifest.json \
            --output admin-recovery-evidence/control-center-post-state.json

      - name: Require Admin recovery source and production post-state
        id: admin_recovery_postcheck
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_snapshot.outcome == 'success'
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" postcheck-admin-recovery \
            --policy "$NELYON_POLICY" \
            --request release-artifact/request.json \
            --recovery-manifest release-artifact/bundle/manifest.json \
            --verified-source admin-recovery-evidence/verified-source.json \
            --current-snapshot admin-recovery-evidence/control-center-post-state.json \
            --admin-manifest admin-release-artifact/admin-web-manifest.json \
            --build admin-evidence/admin-web-build.json \
            --output admin-recovery-evidence/postcheck-admin-recovery-result.json
          echo "ADMIN RECOVERY POSTCHECK SUCCESS" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture Cloudflare pre-state
        id: admin_prestate
        if: >-
          needs.plan.outputs.admin_enabled == 'true' && steps.admin_build.outcome == 'success' &&
          ((needs.plan.outputs.mode == 'release') ||
           (needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_postcheck.outcome == 'success'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          "$NELYON_WRANGLER" deployments status \
            --config apps/admin-web/deployment/wrangler.preview.jsonc --json \
            > admin-evidence/admin-web-before-deployment.json
          node scripts/nelyon-admin-production-release.mjs active-version \
            --deployment admin-evidence/admin-web-before-deployment.json \
            --output admin-evidence/admin-web-previous.json
          "$NELYON_WRANGLER" versions list \
            --config apps/admin-web/deployment/wrangler.preview.jsonc --json \
            > admin-evidence/admin-web-before-versions.json
          node scripts/nelyon-admin-production-release.mjs capture-routes \
            --phase pre \
            --output admin-evidence/admin-web-before-routes.json

      - name: Verify Admin recovery Cloudflare pre-state
        id: admin_recovery_cloudflare_prestate
        if: needs.plan.outputs.mode == 'admin_recovery' && steps.admin_prestate.outcome == 'success'
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" verify-admin-recovery-cloudflare-prestate \
            --verified-source admin-recovery-evidence/verified-source.json \
            --previous admin-evidence/admin-web-previous.json \
            --routes admin-evidence/admin-web-before-routes.json \
            --output admin-recovery-evidence/cloudflare-prestate-verification.json

      - name: Verify exact remote migration dry-run before mutation
        id: migration_dry_run
        if: needs.plan.outputs.mode == 'release'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          supabase db push --help >/dev/null
          supabase functions deploy --help >/dev/null
          supabase db push --dry-run --project-ref "$NELYON_PROJECT_REF" --skip-vault --yes --output-format json > gate-evidence/migration-dry-run.txt
          test -f gate-evidence/gate-proof.json
          node "$NELYON_HELPER" verify-dry-run --input gate-evidence/migration-dry-run.txt --manifest release-artifact/bundle/manifest.json --output gate-evidence/migration-dry-run.json
          rm gate-evidence/migration-dry-run.txt

      - name: Apply exact manifest migrations
        id: apply_migrations
        if: needs.plan.outputs.mode == 'release'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" revalidate --policy "$NELYON_POLICY" --request release-artifact/request.json --bundle release-artifact/bundle --compiler-sha256 "${{ needs.plan.outputs.compiler_sha256 }}" --remote-evidence release-artifact/remote-evidence.json --output gate-evidence/pre-migration-revalidation.json
          supabase db push --project-ref "$NELYON_PROJECT_REF" --skip-vault --yes

      - name: Deploy each exact manifest function
        id: deploy_functions
        if: needs.plan.outputs.mode == 'release'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" revalidate --policy "$NELYON_POLICY" --request release-artifact/request.json --bundle release-artifact/bundle --compiler-sha256 "${{ needs.plan.outputs.compiler_sha256 }}" --remote-evidence release-artifact/remote-evidence.json --output gate-evidence/pre-function-revalidation.json
          while IFS= read -r function_name; do
            test -n "$function_name"
            node "$NELYON_HELPER" verify-function-contract --manifest release-artifact/bundle/manifest.json --function "$function_name"
            supabase functions deploy "$function_name" --project-ref "$NELYON_PROJECT_REF" --use-api
          done < <(node -e "const m=require('./release-artifact/bundle/manifest.json'); for(const n of m.resources.functions) console.log(n)")

      - name: Capture immutable read-only production post-snapshot
        id: post_snapshot
        if: always() && needs.plan.outputs.mode == 'release' && steps.pre_snapshot.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/nelyon-production-snapshot-adapter.mjs capture \
            --phase post \
            --policy "$NELYON_POLICY" \
            --request release-artifact/request.json \
            --manifest release-artifact/bundle/manifest.json \
            --output gate-evidence/production-post.json

      - name: Require postcheck before release success
        id: postcheck
        if: always() && needs.plan.outputs.mode == 'release' && steps.pre_snapshot.outcome == 'success' && steps.post_snapshot.outcome == 'success'
        run: |
          set -euo pipefail
          node "$NELYON_HELPER" postcheck --policy "$NELYON_POLICY" --request release-artifact/request.json --manifest release-artifact/bundle/manifest.json --pre-snapshot gate-evidence/production-pre.json --post-snapshot gate-evidence/production-post.json --output gate-evidence/postcheck-result.json
          echo "SUPABASE POSTCHECK SUCCESS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one immutable Admin version
        id: admin_upload
        if: >-
          needs.plan.outputs.admin_enabled == 'true' && steps.admin_prestate.outcome == 'success' &&
          ((needs.plan.outputs.mode == 'release' && steps.postcheck.outcome == 'success') ||
           (needs.plan.outputs.mode == 'admin_recovery' && steps.admin_recovery_postcheck.outcome == 'success' &&
            steps.admin_recovery_cloudflare_prestate.outcome == 'success'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          VERSION_TAG="$(node -p "JSON.parse(require('fs').readFileSync('admin-release-artifact/admin-web-manifest.json','utf8')).worker.version_tag")"
          PREVIEW_ALIAS="$(node -p "JSON.parse(require('fs').readFileSync('admin-release-artifact/admin-web-manifest.json','utf8')).worker.preview_alias")"
          BUILD_DIGEST="$(node -p "JSON.parse(require('fs').readFileSync('admin-evidence/admin-web-build.json','utf8')).dist_sha256")"
          "$NELYON_WRANGLER" versions upload \
            --config apps/admin-web/deployment/wrangler.preview.jsonc \
            --strict \
            --tag "$VERSION_TAG" \
            --message "b:${BUILD_DIGEST}" \
            --preview-alias "$PREVIEW_ALIAS" \
            > admin-evidence/admin-web-upload.log 2>&1
          "$NELYON_WRANGLER" versions list \
            --config apps/admin-web/deployment/wrangler.preview.jsonc --json \
            > admin-evidence/admin-web-after-versions.json
          node scripts/nelyon-admin-production-release.mjs identify-upload \
            --source-manifest admin-release-artifact/admin-web-manifest.json \
            --before admin-evidence/admin-web-before-versions.json \
            --after admin-evidence/admin-web-after-versions.json \
            --upload-log admin-evidence/admin-web-upload.log \
            --output admin-evidence/admin-web-candidate-id.json

      - name: Attest and smoke the exact uploaded Admin version
        id: admin_candidate
        if: (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true' && steps.admin_upload.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          VERSION_ID="$(node -p "JSON.parse(require('fs').readFileSync('admin-evidence/admin-web-candidate-id.json','utf8')).version_id")"
          "$NELYON_WRANGLER" versions view "$VERSION_ID" \
            --config apps/admin-web/deployment/wrangler.preview.jsonc --json \
            > admin-evidence/admin-web-version.json
          node scripts/nelyon-admin-production-release.mjs identify-upload \
            --source-manifest admin-release-artifact/admin-web-manifest.json \
            --before admin-evidence/admin-web-before-versions.json \
            --after admin-evidence/admin-web-after-versions.json \
            --version-view admin-evidence/admin-web-version.json \
            --upload-log admin-evidence/admin-web-upload.log \
            --build-manifest admin-evidence/admin-web-build.json \
            --output admin-evidence/admin-web-candidate.json
          PREVIEW_URL="$(node -p "JSON.parse(require('fs').readFileSync('admin-evidence/admin-web-candidate.json','utf8')).preview_url")"
          node scripts/nelyon-admin-production-release.mjs smoke \
            --base-url "$PREVIEW_URL" \
            --candidate admin-evidence/admin-web-candidate.json \
            --build admin-evidence/admin-web-build.json \
            --output admin-evidence/admin-web-preview-http.json

      - name: Promote the exact smoked Admin version
        id: admin_promote
        if: (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true' && steps.admin_candidate.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          VERSION_ID="$(node -p "JSON.parse(require('fs').readFileSync('admin-evidence/admin-web-candidate.json','utf8')).version_id")"
          "$NELYON_WRANGLER" versions deploy \
            --config apps/admin-web/deployment/wrangler.preview.jsonc \
            --name nelyon-admin-web \
            --version-id "$VERSION_ID" \
            --percentage 100 \
            --message "Nelyon protected release ${{ inputs.release_id }}" \
            --yes
          "$NELYON_WRANGLER" deployments status \
            --config apps/admin-web/deployment/wrangler.preview.jsonc --json \
            > admin-evidence/admin-web-promoted-deployment.json
          node scripts/nelyon-admin-production-release.mjs active-version \
            --deployment admin-evidence/admin-web-promoted-deployment.json \
            --expected-version "$VERSION_ID" \
            --output admin-evidence/admin-web-promoted-version.json

      - name: Verify promoted Admin version on temporary workers.dev
        id: admin_promoted_smoke
        if: (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true' && steps.admin_promote.outcome == 'success'
        run: |
          set -euo pipefail
          SMOKE_OK=false
          for attempt in $(seq 1 24); do
            ATTEMPT_OUTPUT="admin-evidence/admin-web-promoted-http-attempt-${attempt}.json"
            if node scripts/nelyon-admin-production-release.mjs smoke \
              --base-url https://nelyon-admin-web.nelyon.workers.dev \
              --candidate admin-evidence/admin-web-candidate.json \
              --build admin-evidence/admin-web-build.json \
              --output "${ATTEMPT_OUTPUT}"; then
              mv "${ATTEMPT_OUTPUT}" admin-evidence/admin-web-promoted-http.json
              SMOKE_OK=true
              break
            fi
            if [ "${attempt}" -lt 24 ]; then sleep 5; fi
          done
          test "${SMOKE_OK}" = 'true'

      - name: Apply exact Admin production routes
        id: admin_routes
        if: (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true' && steps.admin_promoted_smoke.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          "$NELYON_WRANGLER" triggers deploy \
            --config apps/admin-web/deployment/wrangler.route.jsonc

      - name: Purge exact Admin production cache prefix
        id: admin_cache_purge
        if: (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true' && steps.admin_routes.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/nelyon-admin-production-release.mjs purge-admin-cache \
            --output admin-evidence/admin-web-cache-purge.json

      - name: Verify exact Admin production version, routes, and HTTP matrix
        id: admin_finalize
        if: (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true' && steps.admin_cache_purge.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SMOKE_OK=false
          for attempt in $(seq 1 12); do
            ATTEMPT_OUTPUT="admin-evidence/admin-web-production-http-attempt-${attempt}.json"
            if node scripts/nelyon-admin-production-release.mjs smoke \
              --base-url https://nelyon.app \
              --build admin-evidence/admin-web-build.json \
              --output "${ATTEMPT_OUTPUT}"; then
              mv "${ATTEMPT_OUTPUT}" admin-evidence/admin-web-production-http.json
              SMOKE_OK=true
              break
            fi
            if [ "${attempt}" -lt 12 ]; then sleep 5; fi
          done
          test "${SMOKE_OK}" = 'true'
          "$NELYON_WRANGLER" deployments status \
            --config apps/admin-web/deployment/wrangler.preview.jsonc --json \
            > admin-evidence/admin-web-after-deployment.json
          node scripts/nelyon-admin-production-release.mjs capture-routes \
            --phase post \
            --output admin-evidence/admin-web-after-routes.json
          node scripts/nelyon-admin-production-release.mjs finalize \
            --source-manifest admin-release-artifact/admin-web-manifest.json \
            --candidate admin-evidence/admin-web-candidate.json \
            --deployment admin-evidence/admin-web-after-deployment.json \
            --routes admin-evidence/admin-web-after-routes.json \
            --http admin-evidence/admin-web-production-http.json \
            --build admin-evidence/admin-web-build.json \
            --output admin-evidence/admin-web-release-result.json

      - name: Recover previous Admin production version and routes
        id: admin_recovery
        if: always() && (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'admin_recovery') && needs.plan.outputs.admin_enabled == 'true' && steps.admin_candidate.outcome == 'success' && steps.admin_finalize.outcome != 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          PREVIOUS_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('admin-evidence/admin-web-previous.json','utf8')).version_id")"
          "$NELYON_WRANGLER" versions deploy \
            --config apps/admin-web/deployment/wrangler.preview.jsonc \
            --name nelyon-admin-web \
            --version-id "$PREVIOUS_VERSION" \
            --percentage 100 \
            --message "Recovery for failed Nelyon release ${{ inputs.release_id }}" \
            --yes
          node scripts/nelyon-admin-production-release.mjs restore-routes \
            --before admin-evidence/admin-web-before-routes.json \
            --output admin-evidence/admin-web-recovered-routes.json
          node scripts/nelyon-admin-production-release.mjs purge-admin-cache \
            --output admin-evidence/admin-web-recovery-cache-purge.json
          "$NELYON_WRANGLER" deployments status \
            --config apps/admin-web/deployment/wrangler.preview.jsonc --json \
            > admin-evidence/admin-web-recovered-deployment.json
          node scripts/nelyon-admin-production-release.mjs verify-recovery \
            --previous admin-evidence/admin-web-previous.json \
            --deployment admin-evidence/admin-web-recovered-deployment.json \
            --before-routes admin-evidence/admin-web-before-routes.json \
            --after-routes admin-evidence/admin-web-recovered-routes.json \
            --output admin-evidence/admin-web-recovery.json

      - name: Require complete protected release success
        id: release_complete
        if: >-
          always() &&
          ((needs.plan.outputs.mode == 'release' && steps.postcheck.outcome == 'success' &&
            (needs.plan.outputs.admin_enabled != 'true' || steps.admin_finalize.outcome == 'success')) ||
           (needs.plan.outputs.mode == 'admin_recovery' &&
            steps.admin_recovery_postcheck.outcome == 'success' && steps.admin_finalize.outcome == 'success'))
        run: |
          set -euo pipefail
          echo "RELEASE SUCCESS" >> "$GITHUB_STEP_SUMMARY"

      - name: Record sanitized release observation
        if: always() && needs.plan.outputs.mode == 'release'
        env:
          PRE_SNAPSHOT_OUTCOME: ${{ steps.pre_snapshot.outcome }}
          PRE_VERIFY_OUTCOME: ${{ steps.verify_pre_snapshot.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.migration_dry_run.outcome }}
          MIGRATION_OUTCOME: ${{ steps.apply_migrations.outcome }}
          FUNCTIONS_OUTCOME: ${{ steps.deploy_functions.outcome }}
          POST_SNAPSHOT_OUTCOME: ${{ steps.post_snapshot.outcome }}
          POSTCHECK_OUTCOME: ${{ steps.postcheck.outcome }}
          RELEASE_COMPLETE_OUTCOME: ${{ steps.release_complete.outcome }}
          ADMIN_ENABLED: ${{ needs.plan.outputs.admin_enabled }}
          ADMIN_BUILD_OUTCOME: ${{ steps.admin_build.outcome }}
          ADMIN_UPLOAD_OUTCOME: ${{ steps.admin_upload.outcome }}
          ADMIN_CANDIDATE_OUTCOME: ${{ steps.admin_candidate.outcome }}
          ADMIN_PROMOTE_OUTCOME: ${{ steps.admin_promote.outcome }}
          ADMIN_ROUTES_OUTCOME: ${{ steps.admin_routes.outcome }}
          ADMIN_PROMOTED_SMOKE_OUTCOME: ${{ steps.admin_promoted_smoke.outcome }}
          ADMIN_CACHE_PURGE_OUTCOME: ${{ steps.admin_cache_purge.outcome }}
          ADMIN_FINALIZE_OUTCOME: ${{ steps.admin_finalize.outcome }}
          ADMIN_RECOVERY_OUTCOME: ${{ steps.admin_recovery.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const safeDigest = path => {
            if (!existsSync(path)) return null;
            const body = JSON.parse(readFileSync(path, 'utf8'));
            return typeof body.evidence_sha256 === 'string' ? body.evidence_sha256 : null;
          };
          const safeFileDigest = path => existsSync(path)
            ? createHash('sha256').update(readFileSync(path)).digest('hex')
            : null;
          const observation = {
            schema_version: 1,
            result: process.env.RELEASE_COMPLETE_OUTCOME === 'success' ? 'SUCCESS' : 'INCOMPLETE_OR_FAILED',
            steps: {
              pre_snapshot: process.env.PRE_SNAPSHOT_OUTCOME,
              pre_verification: process.env.PRE_VERIFY_OUTCOME,
              migration_dry_run: process.env.DRY_RUN_OUTCOME,
              migrations: process.env.MIGRATION_OUTCOME,
              functions: process.env.FUNCTIONS_OUTCOME,
              post_snapshot: process.env.POST_SNAPSHOT_OUTCOME,
              postcheck: process.env.POSTCHECK_OUTCOME,
            },
            admin_web: {
              required: process.env.ADMIN_ENABLED === 'true',
              build: process.env.ADMIN_BUILD_OUTCOME,
              upload: process.env.ADMIN_UPLOAD_OUTCOME,
              candidate: process.env.ADMIN_CANDIDATE_OUTCOME,
              promote: process.env.ADMIN_PROMOTE_OUTCOME,
              routes: process.env.ADMIN_ROUTES_OUTCOME,
              promoted_smoke: process.env.ADMIN_PROMOTED_SMOKE_OUTCOME,
              cache_purge: process.env.ADMIN_CACHE_PURGE_OUTCOME,
              finalize: process.env.ADMIN_FINALIZE_OUTCOME,
              recovery: process.env.ADMIN_RECOVERY_OUTCOME,
              result_sha256: safeFileDigest('admin-evidence/admin-web-release-result.json'),
              recovery_sha256: safeFileDigest('admin-evidence/admin-web-recovery.json'),
            },
            pre_evidence_sha256: safeDigest('gate-evidence/production-pre.json'),
            post_evidence_sha256: safeDigest('gate-evidence/production-post.json'),
            postcheck_file_sha256: safeFileDigest('gate-evidence/postcheck-result.json'),
          };
          writeFileSync('gate-evidence/release-observation.json', `${JSON.stringify(observation)}\n`, { flag: 'wx' });
          NODE

      - name: Stage sanitized Admin Web release evidence
        if: always() && needs.plan.outputs.mode == 'release' && needs.plan.outputs.admin_enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p admin-source-evidence
          for path in \
            admin-release-artifact/admin-web-manifest.json \
            admin-release-artifact/admin-web-manifest.sha256 \
            admin-evidence/admin-web-build.json \
            admin-evidence/admin-web-previous.json \
            admin-evidence/admin-web-before-routes.json \
            admin-evidence/admin-web-candidate.json \
            admin-evidence/admin-web-preview-http.json \
            admin-evidence/admin-web-promoted-version.json \
            admin-evidence/admin-web-promoted-http.json \
            admin-evidence/admin-web-cache-purge.json \
            admin-evidence/admin-web-after-routes.json \
            admin-evidence/admin-web-production-http.json \
            admin-evidence/admin-web-release-result.json \
            admin-evidence/admin-web-recovered-routes.json \
            admin-evidence/admin-web-recovered-deployment.json \
            admin-evidence/admin-web-recovery-cache-purge.json \
            admin-evidence/admin-web-recovery.json; do
            if test -f "$path"; then cp "$path" admin-source-evidence/; fi
          done

      - name: Upload sanitized Admin Web release evidence
        if: always() && needs.plan.outputs.mode == 'release' && needs.plan.outputs.admin_enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nelyon-admin-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: admin-source-evidence
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Upload sanitized gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nelyon-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            gate-evidence/revalidation.json
            gate-evidence/gate-proof.json
            gate-evidence/pre-snapshot-verification.json
            gate-evidence/migration-dry-run.json
            gate-evidence/pre-migration-revalidation.json
            gate-evidence/pre-function-revalidation.json
            gate-evidence/postcheck-result.json
            gate-evidence/release-observation.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Upload immutable Admin recovery evidence
        if: always() && needs.plan.outputs.mode == 'admin_recovery'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nelyon-admin-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            admin-recovery-evidence/verified-source.json
            admin-recovery-evidence/postcheck-recovery-chain.json
            admin-recovery-evidence/control-center-post-state.json
            admin-recovery-evidence/postcheck-admin-recovery-result.json
            admin-recovery-evidence/cloudflare-prestate-verification.json
            admin-release-artifact/admin-web-manifest.json
            admin-release-artifact/admin-web-manifest.sha256
            admin-evidence/admin-web-build.json
            admin-evidence/admin-web-previous.json
            admin-evidence/admin-web-before-routes.json
            admin-evidence/admin-web-candidate.json
            admin-evidence/admin-web-preview-http.json
            admin-evidence/admin-web-promoted-version.json
            admin-evidence/admin-web-promoted-http.json
            admin-evidence/admin-web-cache-purge.json
            admin-evidence/admin-web-after-routes.json
            admin-evidence/admin-web-production-http.json
            admin-evidence/admin-web-release-result.json
            admin-evidence/admin-web-recovered-routes.json
            admin-evidence/admin-web-recovered-deployment.json
            admin-evidence/admin-web-recovery-cache-purge.json
            admin-evidence/admin-web-recovery.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
