      - name: Resolve protected private authority before Admin upload
        id: b2_admin_upload_authority
        if: >-
          needs.plan.outputs.mode == 'release' && needs.plan.outputs.admin_enabled == 'true' &&
          steps.admin_temp_urls_enable.outcome == 'success' && steps.postcheck.outcome == 'success'
        env: *current_private_authority_env
        run: |
          set -euo pipefail
