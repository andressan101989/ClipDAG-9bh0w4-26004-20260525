        id: b2_admin_recovery_rollback_cache_purge_authority_cleanup
        if: >-
          always() && needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_enabled == 'true' &&
          needs.plan.outputs.admin_recovery_b2_required == 'true' &&
          steps.admin_recovery_routes.outcome == 'success'
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/nelyon-private-runtime-cleanup.cjs"
          rm -f "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-mutation-stage.json"

      - name: Purge recovered Admin production cache
        id: admin_recovery_cache_purge
        if: >-
          always() && needs.plan.outputs.admin_enabled == 'true' && steps.admin_recovery_routes.outcome == 'success' &&
          ((needs.plan.outputs.mode == 'release' &&
            steps.b2_admin_rollback_cache_purge_authority.outcome == 'success' &&
            steps.b2_admin_rollback_cache_purge_authority_cleanup.outcome == 'success') ||
           (needs.plan.outputs.mode == 'admin_recovery' &&
            ((needs.plan.outputs.admin_recovery_b2_required == 'true' &&
              steps.b2_admin_recovery_rollback_cache_purge_authority.outcome == 'success' &&
              steps.b2_admin_recovery_rollback_cache_purge_authority_cleanup.outcome == 'success') ||
             needs.plan.outputs.admin_recovery_b2_required != 'true')))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_RECOVERY_B2_REQUIRED: ${{ needs.plan.outputs.admin_recovery_b2_required }}
        run: |
          set -euo pipefail
          if [ "${{ needs.plan.outputs.mode }}" = 'release' ]; then
            cmp "$RUNNER_TEMP/nelyon-private-authority-public/expected-receipt.json" "$RUNNER_TEMP/nelyon-private-authority-public/admin-rollback-cache-purge-receipt.json"
          elif [ "$ADMIN_RECOVERY_B2_REQUIRED" = 'true' ]; then
            cmp "$RUNNER_TEMP/nelyon-private-authority-public/expected-receipt.json" "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-rollback-cache-purge-receipt.json"
          fi
          node scripts/nelyon-admin-production-release.mjs purge-admin-cache \
            --output admin-evidence/admin-web-recovery-cache-purge.json

      - name: Verify recovered Admin production version and routes
        id: admin_recovery
        if: >-
          always() && needs.plan.outputs.admin_enabled == 'true' &&
          steps.admin_recovery_cache_purge.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          "$NELYON_WRANGLER" deployments status \
            --config apps/admin-web/deployment/wrangler.preview.jsonc --json \
            > admin-evidence/admin-web-recovered-deployment.json
          node scripts/nelyon-admin-production-release.mjs verify-recovery \
            --previous admin-evidence/admin-web-previous.json \
            --deployment admin-evidence/admin-web-recovered-deployment.json \
            --before-routes admin-evidence/admin-web-before-routes.json \
            --after-routes admin-evidence/admin-web-recovered-routes.json \
            --output admin-evidence/admin-web-recovery.json

      - name: Verify independent private runtime closure before closing temporary Admin URLs
        id: b2_admin_temp_urls_closure
        if: >-
          always() && (needs.plan.outputs.mode == 'release' ||
          (needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_recovery_b2_required == 'true')) &&
          needs.plan.outputs.admin_enabled == 'true' && steps.admin_temp_urls_prestate.outcome == 'success'
        env:
          NELYON_PRIVATE_AUTHORITY_RUNTIME_CLOSURE_SHA256: ${{ vars.NELYON_PRIVATE_AUTHORITY_RUNTIME_CLOSURE_SHA256 }}
        run: node "$RUNNER_TEMP/nelyon-private-runtime-bootstrap.cjs"

      - name: Resolve protected private authority before closing temporary Admin URLs
        id: b2_admin_temp_urls_cleanup_authority
        if: >-
          always() && steps.b2_admin_temp_urls_closure.outcome == 'success' && needs.plan.outputs.mode == 'release' && needs.plan.outputs.admin_enabled == 'true' &&
          steps.admin_temp_urls_prestate.outcome == 'success'
        env: *current_private_authority_env
        run: |
          set -euo pipefail
          node scripts/nelyon-private-authority-cli.mjs authority-proof \
            --policy "$NELYON_POLICY" --request release-artifact/request.json --bundle release-artifact/bundle \
            --verification-output "$RUNNER_TEMP/nelyon-private-authority-public/admin-temp-urls-cleanup-receipt.json"

      - name: Clean private authority scratch before closing temporary Admin URLs
        id: b2_admin_temp_urls_cleanup_authority_cleanup
        if: >-
          always() && needs.plan.outputs.mode == 'release' && needs.plan.outputs.admin_enabled == 'true' &&
          steps.admin_temp_urls_prestate.outcome == 'success'
        run: node "$RUNNER_TEMP/nelyon-private-runtime-cleanup.cjs"

      - name: Resolve protected private authority before Admin recovery temporary URL closure
        id: b2_admin_recovery_temp_urls_cleanup_authority
        if: >-
          always() && steps.b2_admin_temp_urls_closure.outcome == 'success' && needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_enabled == 'true' &&
          needs.plan.outputs.admin_recovery_b2_required == 'true' &&
          steps.admin_temp_urls_prestate.outcome == 'success'
        env: *admin_historical_private_authority_supabase_env
        run: |
          set -euo pipefail
          chain_args=()
          if [ -d admin-recovery-evidence/authority-chain-release ]; then
            chain_args=(--chain-run admin-recovery-evidence/authority-chain-run.json
              --chain-artifacts admin-recovery-evidence/authority-chain-artifacts.json
              --chain-release-bundle admin-recovery-evidence/authority-chain-release
              --chain-gate-evidence admin-recovery-evidence/authority-chain-gate
              --chain-recovery-evidence admin-recovery-evidence/authority-chain-recovery)
          fi
          node scripts/nelyon-private-authority-cli.mjs verify-admin-recovery-cloudflare-prestate \
            --policy "$NELYON_POLICY" --request release-artifact/request.json --bundle release-artifact/bundle \
            --verification-output "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-temp-urls-cleanup-receipt.json" \
            --recovery-source-run "${{ steps.admin_recovery_authority_source.outputs.source_run_id }}" \
            --run admin-recovery-evidence/authority-source-run.json \
            --artifacts admin-recovery-evidence/authority-source-artifacts.json \
            --release-bundle admin-recovery-evidence/authority-source-release \
            --gate-evidence admin-recovery-evidence/authority-source-gate \
            --admin-evidence admin-recovery-evidence/authority-source-admin \
            "${chain_args[@]}" \
            --verified-source "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-verified-source.json" \
            --previous "$RUNNER_TEMP/nelyon-private-authority-public/admin-web-previous.json" \
            --routes "$RUNNER_TEMP/nelyon-private-authority-public/admin-web-before-routes.json" \
            --stage-output "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-mutation-stage.json"

      - name: Clean private authority scratch before Admin recovery temporary URL closure
        id: b2_admin_recovery_temp_urls_cleanup_authority_cleanup
        if: >-
          always() && needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_enabled == 'true' &&
          needs.plan.outputs.admin_recovery_b2_required == 'true' &&
          steps.admin_temp_urls_prestate.outcome == 'success'
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/nelyon-private-runtime-cleanup.cjs"
          rm -f "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-mutation-stage.json"

      - name: Close and verify temporary Admin URLs
        id: admin_temp_urls_cleanup
        if: >-
          always() && needs.plan.outputs.admin_enabled == 'true' &&
          steps.admin_temp_urls_prestate.outcome == 'success' &&
          (steps.b2_admin_temp_urls_closure.outcome == 'success' ||
           (needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_recovery_b2_required != 'true'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_RECOVERY_B2_REQUIRED: ${{ needs.plan.outputs.admin_recovery_b2_required }}
        run: |
          set -euo pipefail
          TEMP_URLS_CLOSED=false
          for attempt in $(seq 1 5); do
            if node scripts/nelyon-admin-production-release.mjs preview-lifecycle \
              --enabled false \
              --previews-enabled false \
              --output admin-evidence/admin-web-preview-closed.json; then
              TEMP_URLS_CLOSED=true
              break
            fi
            if [ "${attempt}" -lt 5 ]; then sleep 3; fi
          done
          test "${TEMP_URLS_CLOSED}" = 'true'
          if [ "${{ needs.plan.outputs.mode }}" = 'release' ]; then
            test "${{ steps.b2_admin_temp_urls_cleanup_authority.outcome }}" = 'success'
            test "${{ steps.b2_admin_temp_urls_cleanup_authority_cleanup.outcome }}" = 'success'
            cmp "$RUNNER_TEMP/nelyon-private-authority-public/expected-receipt.json" "$RUNNER_TEMP/nelyon-private-authority-public/admin-temp-urls-cleanup-receipt.json"
          elif [ "$ADMIN_RECOVERY_B2_REQUIRED" = 'true' ]; then
            test "${{ needs.plan.outputs.mode }}" = 'admin_recovery'
            test "${{ steps.b2_admin_recovery_temp_urls_cleanup_authority.outcome }}" = 'success'
            test "${{ steps.b2_admin_recovery_temp_urls_cleanup_authority_cleanup.outcome }}" = 'success'
            cmp "$RUNNER_TEMP/nelyon-private-authority-public/expected-receipt.json" "$RUNNER_TEMP/nelyon-private-authority-public/admin-recovery-temp-urls-cleanup-receipt.json"
          else
            test "${{ needs.plan.outputs.mode }}" = 'admin_recovery'
          fi

      - name: Report integrity-blocked temporary Admin URL cleanup
        if: >-
          always() && needs.plan.outputs.admin_enabled == 'true' &&
          steps.admin_temp_urls_prestate.outcome == 'success' &&
          (needs.plan.outputs.mode == 'release' ||
           (needs.plan.outputs.mode == 'admin_recovery' && needs.plan.outputs.admin_recovery_b2_required == 'true')) &&
          steps.b2_admin_temp_urls_closure.outcome != 'success'
        run: |
          echo '::error::Temporary Admin URL cleanup not executed: runtime integrity was not verified; URL closure is unconfirmed.'
          exit 1

      - &b2_diagnostic_step_25
        name: Clean private authority scratch before final result
        id: b2_final_authority_cleanup
        if: always()
        run: node "$RUNNER_TEMP/nelyon-private-runtime-cleanup.cjs"

      - name: Require complete protected release success
        id: release_complete
        if: >-
          always() && steps.b2_final_authority_cleanup.outcome == 'success' &&
          ((needs.plan.outputs.mode == 'release' && steps.postcheck.outcome == 'success' &&
            (needs.plan.outputs.admin_enabled != 'true' ||
             (steps.admin_finalize.outcome == 'success' &&
              steps.b2_admin_temp_urls_cleanup_authority.outcome == 'success' &&
              steps.b2_admin_temp_urls_cleanup_authority_cleanup.outcome == 'success' &&
              steps.admin_temp_urls_cleanup.outcome == 'success'))) ||
           (needs.plan.outputs.mode == 'admin_recovery' &&
            steps.admin_recovery_postcheck.outcome == 'success' &&
            steps.admin_finalize.outcome == 'success' &&
            ((needs.plan.outputs.admin_recovery_b2_required == 'true' &&
              steps.b2_admin_recovery_temp_urls_cleanup_authority.outcome == 'success' &&
              steps.b2_admin_recovery_temp_urls_cleanup_authority_cleanup.outcome == 'success') ||
             needs.plan.outputs.admin_recovery_b2_required != 'true') &&
            steps.admin_temp_urls_cleanup.outcome == 'success'))
        run: |
          set -euo pipefail
          echo "RELEASE SUCCESS" >> "$GITHUB_STEP_SUMMARY"

      - name: Record sanitized release observation
        if: always() && needs.plan.outputs.mode == 'release'
        env:
          PRE_SNAPSHOT_OUTCOME: ${{ steps.pre_snapshot.outcome }}
          PRE_VERIFY_OUTCOME: ${{ steps.verify_pre_snapshot.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.migration_dry_run.outcome }}
          MIGRATION_OUTCOME: ${{ steps.apply_migrations.outcome }}
          FUNCTIONS_OUTCOME: ${{ steps.deploy_functions.outcome }}
          POST_SNAPSHOT_OUTCOME: ${{ steps.post_snapshot.outcome }}
          POSTCHECK_OUTCOME: ${{ steps.postcheck.outcome }}
          RELEASE_COMPLETE_OUTCOME: ${{ steps.release_complete.outcome }}
          ADMIN_ENABLED: ${{ needs.plan.outputs.admin_enabled }}
          ADMIN_BUILD_OUTCOME: ${{ steps.admin_build.outcome }}
          ADMIN_TEMP_URLS_PRESTATE_OUTCOME: ${{ steps.admin_temp_urls_prestate.outcome }}
          ADMIN_TEMP_URLS_ENABLE_OUTCOME: ${{ steps.admin_temp_urls_enable.outcome }}
          ADMIN_UPLOAD_OUTCOME: ${{ steps.admin_upload.outcome }}
          ADMIN_CANDIDATE_OUTCOME: ${{ steps.admin_candidate.outcome }}
          ADMIN_PROMOTE_OUTCOME: ${{ steps.admin_promote.outcome }}
          ADMIN_ROUTES_OUTCOME: ${{ steps.admin_routes.outcome }}
          ADMIN_PROMOTED_SMOKE_OUTCOME: ${{ steps.admin_promoted_smoke.outcome }}
          ADMIN_ROUTE_ACTIVATION_OUTCOME: ${{ steps.admin_route_activation.outcome }}
          ADMIN_CACHE_PURGE_OUTCOME: ${{ steps.admin_cache_purge.outcome }}
          ADMIN_FINALIZE_OUTCOME: ${{ steps.admin_finalize.outcome }}
          ADMIN_RECOVERY_OUTCOME: ${{ steps.admin_recovery.outcome }}
          ADMIN_TEMP_URLS_CLEANUP_OUTCOME: ${{ steps.admin_temp_urls_cleanup.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const safeDigest = path => {
            if (!existsSync(path)) return null;
            const body = JSON.parse(readFileSync(path, 'utf8'));
            return typeof body.evidence_sha256 === 'string' ? body.evidence_sha256 : null;
          };
          const safeFileDigest = path => existsSync(path)
            ? createHash('sha256').update(readFileSync(path)).digest('hex')
            : null;
          const observation = {
            schema_version: 1,
            result: process.env.RELEASE_COMPLETE_OUTCOME === 'success' ? 'SUCCESS' : 'INCOMPLETE_OR_FAILED',
            steps: {
              pre_snapshot: process.env.PRE_SNAPSHOT_OUTCOME,
              pre_verification: process.env.PRE_VERIFY_OUTCOME,
              migration_dry_run: process.env.DRY_RUN_OUTCOME,
              migrations: process.env.MIGRATION_OUTCOME,
              functions: process.env.FUNCTIONS_OUTCOME,
              post_snapshot: process.env.POST_SNAPSHOT_OUTCOME,
              postcheck: process.env.POSTCHECK_OUTCOME,
            },
            admin_web: {
              required: process.env.ADMIN_ENABLED === 'true',
              build: process.env.ADMIN_BUILD_OUTCOME,
              temporary_urls_prestate: process.env.ADMIN_TEMP_URLS_PRESTATE_OUTCOME,
              temporary_urls_enable: process.env.ADMIN_TEMP_URLS_ENABLE_OUTCOME,
              temporary_urls_prestate_sha256: safeFileDigest('admin-evidence/admin-web-preview-before.json'),
              temporary_urls_enable_sha256: safeFileDigest('admin-evidence/admin-web-preview-enabled.json'),
              upload: process.env.ADMIN_UPLOAD_OUTCOME,
              candidate: process.env.ADMIN_CANDIDATE_OUTCOME,
              promote: process.env.ADMIN_PROMOTE_OUTCOME,
              routes: process.env.ADMIN_ROUTES_OUTCOME,
              promoted_smoke: process.env.ADMIN_PROMOTED_SMOKE_OUTCOME,
              route_activation: process.env.ADMIN_ROUTE_ACTIVATION_OUTCOME,
              cache_purge: process.env.ADMIN_CACHE_PURGE_OUTCOME,
              finalize: process.env.ADMIN_FINALIZE_OUTCOME,
              recovery: process.env.ADMIN_RECOVERY_OUTCOME,
              temporary_urls_cleanup: process.env.ADMIN_TEMP_URLS_CLEANUP_OUTCOME,
              temporary_urls_cleanup_sha256: safeFileDigest('admin-evidence/admin-web-preview-closed.json'),
              result_sha256: safeFileDigest('admin-evidence/admin-web-release-result.json'),
              recovery_sha256: safeFileDigest('admin-evidence/admin-web-recovery.json'),
            },
            pre_evidence_sha256: safeDigest('gate-evidence/production-pre.json'),
            post_evidence_sha256: safeDigest('gate-evidence/production-post.json'),
            postcheck_file_sha256: safeFileDigest('gate-evidence/postcheck-result.json'),
          };
          writeFileSync('gate-evidence/release-observation.json', `${JSON.stringify(observation)}\n`, { flag: 'wx' });
          NODE

      - name: Stage sanitized Admin Web release evidence
        if: always() && needs.plan.outputs.mode == 'release' && needs.plan.outputs.admin_enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p admin-source-evidence
          for path in \
            admin-release-artifact/admin-web-manifest.json \
            admin-release-artifact/admin-web-manifest.sha256 \
            admin-evidence/admin-web-build.json \
            admin-evidence/admin-web-previous.json \
            admin-evidence/admin-web-before-routes.json \
            admin-evidence/admin-web-preview-before.json \
            admin-evidence/admin-web-preview-enabled.json \
            admin-evidence/admin-web-candidate.json \
            admin-evidence/admin-web-preview-http.json \
            admin-evidence/admin-web-promoted-version.json \
            admin-evidence/admin-web-promoted-http.json \
            admin-evidence/admin-web-route-probe.json \
            admin-evidence/admin-web-cache-purge.json \
            admin-evidence/admin-web-after-routes.json \
            admin-evidence/admin-web-production-http.json \
            admin-evidence/admin-web-release-result.json \
            admin-evidence/admin-web-recovered-routes.json \
            admin-evidence/admin-web-recovered-deployment.json \
            admin-evidence/admin-web-recovery-cache-purge.json \
            admin-evidence/admin-web-recovery.json \
            admin-evidence/admin-web-preview-closed.json; do
            if test -f "$path"; then cp "$path" admin-source-evidence/; fi
          done
          for path in admin-evidence/admin-web-route-probe-attempt-*.json; do
            if test -f "$path"; then cp "$path" admin-source-evidence/; fi
          done

      - name: Upload sanitized Admin Web release evidence
        if: always() && needs.plan.outputs.mode == 'release' && needs.plan.outputs.admin_enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nelyon-admin-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: admin-source-evidence
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Upload sanitized gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nelyon-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            gate-evidence/revalidation.json
            gate-evidence/gate-proof.json
            gate-evidence/pre-snapshot-verification.json
            gate-evidence/migration-dry-run.json
            gate-evidence/protected-stage-proofs.json
            gate-evidence/function-deployment-proof.json
            gate-evidence/pre-migration-revalidation.json
            gate-evidence/pre-function-revalidation.json
            gate-evidence/postcheck-result.json
            gate-evidence/release-observation.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Upload immutable Admin recovery evidence
        if: always() && needs.plan.outputs.mode == 'admin_recovery'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nelyon-admin-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            admin-recovery-evidence/verified-source.json
            admin-recovery-evidence/postcheck-recovery-chain.json
            admin-recovery-evidence/control-center-post-state.json
            admin-recovery-evidence/postcheck-admin-recovery-result.json
            admin-recovery-evidence/cloudflare-prestate-verification.json
            admin-release-artifact/admin-web-manifest.json
            admin-release-artifact/admin-web-manifest.sha256
            admin-evidence/admin-web-build.json
            admin-evidence/admin-web-previous.json
            admin-evidence/admin-web-before-routes.json
            admin-evidence/admin-web-preview-before.json
            admin-evidence/admin-web-preview-enabled.json
            admin-evidence/admin-web-candidate.json
            admin-evidence/admin-web-preview-http.json
            admin-evidence/admin-web-promoted-version.json
            admin-evidence/admin-web-promoted-http.json
            admin-evidence/admin-web-route-probe.json
            admin-evidence/admin-web-route-probe-attempt-*.json
            admin-evidence/admin-web-cache-purge.json
            admin-evidence/admin-web-after-routes.json
            admin-evidence/admin-web-production-http.json
            admin-evidence/admin-web-release-result.json
            admin-evidence/admin-web-recovered-routes.json
            admin-evidence/admin-web-recovered-deployment.json
            admin-evidence/admin-web-recovery-cache-purge.json
            admin-evidence/admin-web-recovery.json
            admin-evidence/admin-web-preview-closed.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  snapshot-diagnostic:
    name: Protected read-only B2 snapshot diagnostic
    needs: [plan, private-authority-check]
    if: >-
      toJSON(inputs.preflight_only) == 'true' && github.ref == 'refs/heads/main' &&
      needs.private-authority-check.result == 'success' &&
      needs.plan.outputs.mode == 'release' && needs.plan.outputs.risk == 'HIGH' &&
      needs.plan.outputs.result == 'PLAN READY' && needs.plan.outputs.blocked == 'false' &&
      fromJSON(needs.plan.outputs.productive_change_count) > 0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: nelyon-supabase-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: read
    env:
      NELYON_RELEASE_POLICY_SHA256: ${{ vars.NELYON_RELEASE_POLICY_SHA256 }}
      SUPABASE_GITHUB_AUTO_DEPLOY_EXPECTED: ${{ vars.SUPABASE_GITHUB_AUTO_DEPLOY_EXPECTED }}
    steps:
      - name: Checkout exact authorized SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js for authorized gate
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'

      - name: Download only this run attempt artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: release-artifact
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Download exact Admin Web plan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.plan.outputs.admin_artifact_name }}
          path: admin-release-artifact
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - *b2_diagnostic_step_5
      - *b2_diagnostic_step_6
      - *b2_diagnostic_step_7
      - *b2_diagnostic_step_8
      - *b2_diagnostic_step_9
      - *b2_diagnostic_step_26
      - *b2_diagnostic_step_27
      - *b2_diagnostic_step_12
      - *b2_diagnostic_step_28
      - *b2_diagnostic_step_14
      - *b2_diagnostic_step_15
      - *b2_diagnostic_step_29
      - *b2_diagnostic_step_30
      - *b2_diagnostic_step_31
      - *b2_diagnostic_step_10
      - *b2_diagnostic_step_11
      - *b2_diagnostic_step_13
      - *b2_diagnostic_step_16
      - *b2_diagnostic_step_17
      - *b2_diagnostic_step_18
      - *b2_diagnostic_step_19
      - *b2_diagnostic_step_20
      - *b2_diagnostic_step_21
      - name: Accept read-only diagnostic snapshot receipt
        id: pre_snapshot
        if: >-
          steps.b2_pre_snapshot_authority.outcome == 'success' &&
          steps.b2_pre_snapshot_authority_cleanup.outcome == 'success'
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const { readFileSync } = require('node:fs');
          const root = process.env.RUNNER_TEMP + '/nelyon-private-authority-public';
          const expected = JSON.parse(readFileSync(root + '/expected-receipt.json', 'utf8'));
          const verification = JSON.parse(readFileSync(root + '/pre-snapshot-authority.json', 'utf8'));
          if (JSON.stringify(verification.receipt ?? verification) !== JSON.stringify(expected)) throw new Error('Diagnostic receipt rejected');
          NODE
      - *b2_diagnostic_step_22
      - *b2_diagnostic_step_23
      - *b2_diagnostic_step_24
      - name: Accept read-only diagnostic baseline receipt
        id: verify_pre_snapshot
        if: >-
          steps.b2_verify_pre_snapshot_authority.outcome == 'success' &&
          steps.b2_verify_pre_snapshot_authority_cleanup.outcome == 'success'
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const { readFileSync } = require('node:fs');
          const root = process.env.RUNNER_TEMP + '/nelyon-private-authority-public';
          const expected = JSON.parse(readFileSync(root + '/expected-receipt.json', 'utf8'));
          const verification = JSON.parse(readFileSync(root + '/pre-snapshot-verification-authority.json', 'utf8'));
          if (JSON.stringify(verification.receipt ?? verification) !== JSON.stringify(expected)) throw new Error('Diagnostic receipt rejected');
          NODE
      - *b2_diagnostic_step_25
      - name: Remove all ephemeral diagnostic outputs
        id: diagnostic_output_cleanup
        if: always()
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve(process.env.RUNNER_TEMP);
          if (fs.realpathSync(root) !== root || fs.lstatSync(root).isSymbolicLink()) throw new Error('Diagnostic cleanup rejected');
          const target = path.join(root, 'nelyon-private-authority-public');
          const inspect = p => {
            const stat = fs.lstatSync(p);
            const relative = path.relative(root, fs.realpathSync(p));
            if (stat.isSymbolicLink() || !relative || relative.startsWith('..') || path.isAbsolute(relative)) throw new Error('Diagnostic cleanup rejected');
            if (stat.isDirectory()) for (const name of fs.readdirSync(p)) inspect(path.join(p, name));
            else if (!stat.isFile()) throw new Error('Diagnostic cleanup rejected');
          };
          if (fs.lstatSync(target, { throwIfNoEntry: false })) {
            inspect(target); fs.rmSync(target, { recursive: true, force: false });
            if (fs.existsSync(target)) throw new Error('Diagnostic cleanup rejected');
          }
          NODE
      - name: Require terminal read-only diagnostic success
        id: diagnostic_terminal
        if: always()
        env:
          DIAGNOSTIC_RESULTS: ${{ steps.b2_release_preflight.outcome }}|${{ steps.b2_release_preflight_cleanup.outcome }}|${{ steps.b2_release_preflight_receipt.outcome }}|${{ steps.b2_release_refresh_authorization.outcome }}|${{ steps.b2_release_refresh_authorization_cleanup.outcome }}|${{ steps.b2_release_refresh_authorization_receipt.outcome }}|${{ steps.b2_release_revalidation.outcome }}|${{ steps.b2_release_revalidation_cleanup.outcome }}|${{ steps.b2_release_revalidation_receipt.outcome }}|${{ steps.b2_release_gate_authority.outcome }}|${{ steps.b2_release_gate_authority_cleanup.outcome }}|${{ steps.b2_release_gate_acceptance.outcome }}|${{ steps.b2_pre_snapshot_authority.outcome }}|${{ steps.b2_pre_snapshot_authority_cleanup.outcome }}|${{ steps.pre_snapshot.outcome }}|${{ steps.b2_verify_pre_snapshot_authority.outcome }}|${{ steps.b2_verify_pre_snapshot_authority_cleanup.outcome }}|${{ steps.verify_pre_snapshot.outcome }}|${{ steps.b2_final_authority_cleanup.outcome }}|${{ steps.diagnostic_output_cleanup.outcome }}
        run: |
          node --input-type=commonjs <<'NODE'
          const results = (process.env.DIAGNOSTIC_RESULTS ?? '').split('|');
          if (results.length !== 20 || results.some(result => result !== 'success')) {
            process.stderr.write('READ_ONLY_DIAGNOSTIC_BLOCKED\n');
            process.exit(2);
          }
          process.stdout.write(JSON.stringify({ schemaVersion: 1, result: 'READ_ONLY_DIAGNOSTIC_VERIFIED', releaseReady: false }) + '\n');
          NODE
